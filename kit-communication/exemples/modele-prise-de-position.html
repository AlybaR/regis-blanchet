<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Modèle prise de position — post 1080×1350 et story 1080×1920</title>
<!-- Modèle validé le 29/10/2026. Pour une nouvelle publication : remplacer photos/regis_senat.jpg, le surtitre (.kick), le titre (.h, mot-clé dans <i>) et le complément (.sub). Rendu PNG : Playwright, capture des éléments #post et #story. Pas de date ni de chiffres sur l’image : ils vont dans la légende. -->
<link rel="stylesheet" href="base.css">
<style>
body{background:#888;display:flex;gap:40px;padding:40px;align-items:flex-start}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--navy);color:#fff}
.story{height:1920px}
.pad{position:absolute;left:84px;right:84px}
.kick{font:800 24px/1 'IN';letter-spacing:.2em;text-transform:uppercase;color:#E8C9A4;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.h{font:700 92px/1.02 'CG';letter-spacing:-.01em;text-shadow:0 3px 18px rgba(0,0,0,.55)}
.h i{font-weight:700;font-style:normal;color:#E8C9A4}
.sub{font:700 50px/1.12 'CG';text-shadow:0 2px 12px rgba(0,0,0,.5)}
.rule{width:120px;height:6px;background:var(--bronze)}
.p{font:400 31px/1.45 'IN';color:#D9E0EA}
.p b{color:#fff;font-weight:700}
.ph{position:absolute;left:0;right:0;top:0}.ph img{width:100%;height:100%;object-fit:cover}
.ph:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,41,69,0) 40%,rgba(27,41,69,.75) 66%,rgba(27,41,69,.95) 82%,var(--navy) 100%)}
.sig{position:absolute;left:84px;right:84px;bottom:64px;display:flex;align-items:center;gap:22px;padding-top:30px;border-top:2px solid rgba(255,255,255,.22)}
.sig .m{width:74px;height:74px;display:flex;align-items:center;justify-content:center;font:600 40px 'CG';background:#fff;color:var(--navy);position:relative;flex:none}
.sig .m:after{content:'';position:absolute;left:14px;right:14px;bottom:11px;height:4px;background:var(--bronze)}
.sig .n{white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.5);font:800 22px/1.35 'IN';letter-spacing:.16em;color:#fff}
.sig .n small{display:block;font-size:17px;color:var(--bronze-l)}
.sig .r{margin-left:auto;text-shadow:0 2px 8px rgba(0,0,0,.6);font:700 19px/1.4 'IN';letter-spacing:.06em;color:rgba(255,255,255,.75);text-align:right}
.sig .lg{display:flex;align-items:center;gap:16px;background:#fff;border-radius:12px;padding:9px 16px;margin-left:22px;flex:none}
.sig .lg img{height:56px;width:auto;display:block}
.sig .lg img+img{height:46px}
@font-face{font-family:'GV';src:url(fonts/great-vibes-latin-400-normal.woff2)}
@font-face{font-family:'GV';src:url(fonts/great-vibes-latin-ext-400-normal.woff2);unicode-range:U+0100-024F}
.nm{display:flex;flex-direction:column;line-height:1;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.nm .pr{font:400 96px/.9 'GV';color:#fff;margin-left:4px}
.nm .no{font:900 66px/1 'IN';letter-spacing:.03em;color:#fff;margin-top:-26px;margin-left:40px}
.nm .fn{font:800 20px/1 'IN';letter-spacing:.2em;color:#E8C9A4;margin-top:12px;margin-left:42px}
.sig.top{align-items:flex-end}
.sig.top{bottom:auto;top:64px;border-top:none;padding-top:0;padding-bottom:0;border-bottom:none;z-index:2}
.shade{position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(180deg,rgba(27,41,69,.92) 0%,rgba(27,41,69,.6) 60%,rgba(27,41,69,0) 100%);z-index:1}
.line{font:500 32px/1.45 'IN';color:#fff}.line b{color:#fff;font-weight:700}
.vote{display:flex;gap:26px}
.vote div{border-top:4px solid var(--bronze);padding-top:18px;flex:1}
.vote b{display:block;font:600 64px/.95 'CG'}
.vote span{display:block;font:400 24px/1.35 'IN';color:#D5DDE8;margin-top:8px}
</style></head><body>

<!-- POST 1080 x 1350 -->
<div class="post" id="post">
  <div class="ph" style="height:1110px"><img src="photos/regis_senat.jpg" alt="" style="object-position:50% 30%"></div>
  <div class="shade" style="height:420px"></div>
  <div class="sig top" style="top:40px"><span class="nm"><span class="pr">Régis</span><span class="no">BLANCHET</span><span class="fn">SÉNATEUR DE L’INDRE</span></span></div>
  <div class="pad" style="top:940px"><div class="kick">Au Sénat · Protection de l’enfance</div></div>
  <div class="pad h" style="top:986px;font-size:86px">J’ai voté pour<br><i>l’imprescriptibilité</i></div>
  <div class="pad sub" style="top:1176px;font-size:46px">des crimes sexuels<br>commis sur les mineurs</div>
</div>

<!-- STORY 1080 x 1920 -->
<div class="post story" id="story">
  <div class="ph" style="height:1520px"><img src="photos/regis_senat.jpg" alt="" style="object-position:50% 40%"></div>
  <div class="shade" style="height:600px"></div>
  <div class="sig top" style="top:200px"><span class="nm"><span class="pr">Régis</span><span class="no">BLANCHET</span><span class="fn">SÉNATEUR DE L’INDRE</span></span></div>
  <div class="pad" style="top:1360px"><div class="kick">Au Sénat · Protection de l’enfance</div></div>
  <div class="pad h" style="top:1410px;font-size:100px">J’ai voté pour<br><i>l’imprescriptibilité</i></div>
  <div class="pad sub" style="top:1630px;font-size:54px">des crimes sexuels<br>commis sur les mineurs</div>
</div>
</body></html>
